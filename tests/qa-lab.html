<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航海改版 QA</title><style>*{box-sizing:border-box}body{margin:0;background:#26333b;color:white;font:14px system-ui}nav{display:flex;gap:8px;padding:8px;align-items:center;flex-wrap:wrap}button,select{padding:8px;min-height:44px}iframe{display:block;border:0}#host{transform-origin:top left;margin:0 8px}#status{padding:4px}</style><nav><select id="scenario" aria-label="測試場景"><option value="new">新遊戲</option><option value="map">自由探索黑霧</option><option value="west-complete">西線成果</option><option value="east-complete">東線成果</option><option value="ordinary-complete">平凡結局成果</option><option value="review">航跡全圖</option><option value="magellan">麥哲倫劇場</option><option value="dias">狄亞士劇場</option><option value="columbus">哥倫布劇場</option><option value="gama">達伽馬劇場</option><option value="rescue">補給耗盡</option></select><label><input id="single" type="checkbox" checked>單一HTML</label><button id="load">載入測試場景</button><button data-w="1024" data-h="768">1024×768</button><button data-w="1180" data-h="820">1180×820</button><button data-w="768" data-h="1024">768×1024</button><button data-w="960" data-h="600">960×600</button><button data-w="390" data-h="844">390×844</button><span id="status"></span></nav><div id="host"><iframe id="gameFrame" title="受測遊戲" sandbox="allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox"></iframe></div><script src="../map-data.js"></script><script src="../content.js"></script><script src="../history-v2.js"></script><script src="../engine.js"></script><script>
const frame=document.getElementById('gameFrame'),host=document.getElementById('host');function size(w,h){frame.width=w;frame.height=h;host.style.width=w+'px';host.style.height=h+'px';host.style.transform='scale('+Math.min(1,(innerWidth-16)/w,(innerHeight-112)/h)+')';document.getElementById('status').textContent=w+'×'+h;}document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>size(+b.dataset.w,+b.dataset.h));size(1024,768);
document.getElementById('load').onclick=async()=>{const which=document.getElementById('scenario').value;await new Promise(resolve=>{frame.onload=()=>{frame.onload=null;resolve();};frame.src='about:blank';});localStorage.setItem('UnknownSeasRPG-settings-v1',JSON.stringify({instantText:true,reducedMotion:true,sfx:false,music:false,waves:false,volume:.35}));if(which==='new'){localStorage.removeItem('UnknownSeasRPG-v20');localStorage.removeItem('UnknownSeasRPG-v10');}else{const e=new VoyageEngine(VoyageMapData,VOYAGE_CONTENT);if(which==='map'||which==='rescue'){e.fresh('測試船長',0,123);e.s.pending=null;if(which==='rescue'){e.s.step=10;e.s.days=4;e.s.x=30;e.s.y=6;e.s.trail.push({x:30,y:6});e.s.lastPassed={id:'madeira',x:30,y:6,trailIndex:1};e.s.food=0;e.checkCrisis();}}else{const name=['east-complete','ordinary-complete'].includes(which)?which:'west-complete';e.load(await(await fetch(name+'.fixture.json')).json());if(which==='review')e.s.pending={type:'review'};if(['magellan','dias','columbus','gama'].includes(which))e.replayHistory(which);}e.validate(e.s);localStorage.setItem('UnknownSeasRPG-v20',e.serialize());}frame.src='../'+(document.getElementById('single').checked?'single.html':'index.html')+'?qa='+Date.now();};
document.getElementById('load').click();
</script></html>
