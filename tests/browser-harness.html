<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航海遊戲尺寸與 iframe 測試</title><style>*{box-sizing:border-box}body{margin:0;background:#26333b;color:white;font:14px system-ui}nav{display:flex;gap:10px;padding:10px;align-items:center}button{padding:12px;border:0;border-radius:5px;background:#e8d7b6;color:#173642}#host{transform-origin:top left;margin:0 10px}iframe{display:block;border:0;background:#072734}#label{padding:10px}</style><nav><button data-w="1024" data-h="768">1024 × 768</button><button data-w="1180" data-h="820">1180 × 820</button><button data-w="768" data-h="1024">768 × 1024</button><button data-w="960" data-h="600">960 × 600 iframe</button><button data-w="390" data-h="844">390 × 844</button><span id="label"></span></nav><div id="host"><iframe id="gameFrame" title="受測航海遊戲" src="../index.html" sandbox="allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox"></iframe></div><script>const frame=document.getElementById('gameFrame'),host=document.getElementById('host');function size(w,h){frame.width=w;frame.height=h;host.style.width=w+'px';host.style.height=h+'px';host.style.transform='scale('+Math.min(1,(innerWidth-20)/w,(innerHeight-65)/h)+')';document.getElementById('label').textContent=w+'×'+h+' CSS viewport';}document.querySelectorAll('button').forEach(b=>b.onclick=()=>size(+b.dataset.w,+b.dataset.h));size(1024,768);</script></html>
