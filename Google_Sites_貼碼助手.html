<!doctype html><html lang="zh-Hant-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Sites 貼碼助手</title><style>*{box-sizing:border-box}body{margin:0;background:#edf0e8;color:#173b44;font:17px/1.8 system-ui}main{max-width:840px;margin:40px auto;background:#fffdf6;padding:30px;border-top:5px solid #b58d42}h1{font-size:28px}button,input,textarea{font:inherit}button{padding:12px 20px;border:0;background:#173f49;color:white;border-radius:8px;min-height:48px;margin:8px}textarea{width:100%;height:190px;resize:vertical;font:12px monospace}label{display:block;margin:20px 0}#status{background:#e7eadf;padding:15px}small{display:block;color:#566e6c}</style><main><h1>把完整遊戲放進 Google Sites</h1><p>選擇本次交付的「未知海域_航海家的傳奇.html」，再複製完整程式碼。圖片已內嵌，不需另外上載圖片資料夾。</p><label>1. 選取完整 HTML 或貼碼 TXT <input id="file" type="file" accept=".html,.txt,text/html,text/plain"></label><button id="copy" disabled>2. 複製完整程式碼</button><button id="select" disabled>手動選取全部</button><p id="status" role="status">尚未選取檔案。</p><textarea id="code" readonly aria-label="完整嵌入程式碼"></textarea><p>3. 在 Google Sites 選「插入 → 嵌入 → 嵌入程式碼」，貼上後按「下一步 → 插入」，拉高遊戲框再發布。</p><small>大量內嵌插畫使程式碼較長；若編輯器拒絕或載入失敗，請改用已託管的遊戲網址或部署指南內的 Apps Script 雲端版。直接貼碼版只提供本機排行榜。班級共享排行需要教師先部署雲端版，再以網址嵌入。</small><p>這個助手只在目前瀏覽器讀取你選擇的檔案，不會上傳。</p></main><script>const f=document.getElementById('file'),area=document.getElementById('code'),status=document.getElementById('status');f.onchange=async()=>{const p=f.files[0];if(!p)return;if(p.size>30000000){status.textContent='請選本次交付的完整HTML，檔案應小於30 MB。';return;}const s=await p.text();if(!s.includes('VoyageEngine')||!s.includes('VoyageAssets')){status.textContent='這不是本次自包含版本；請選交付的完整HTML。';return;}area.value=s;document.getElementById('copy').disabled=false;document.getElementById('select').disabled=false;status.textContent='已讀取 '+(p.size/1048576).toFixed(1)+' MB，可複製。';};const select=()=>{area.focus();area.select();area.setSelectionRange(0,area.value.length);};document.getElementById('select').onclick=()=>{select();status.textContent='已全選。請使用裝置的複製指令。';};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(area.value);status.textContent='完整程式碼已複製。現在到Google Sites貼上。';}catch(_){select();status.textContent='瀏覽器未允許自動複製，已全選內容，請手動複製。';}};</script></html>
